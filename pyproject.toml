[project]
name = "tp-mlops2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.95",
    "fastapi>=0.141.1",
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
    "joblib>=1.6.0",
    "kafka-python>=3.0.11",
    "mlflow>=3.16.0",
    "neo4j>=6.3.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "strawberry-graphql[fastapi]>=0.327.7",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "kaggle>=2.2.4",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "ruff>=0.16.7",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/tp_mlops2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["notebooks", "**/scoring_pb2.py", "**/scoring_pb2_grpc.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
